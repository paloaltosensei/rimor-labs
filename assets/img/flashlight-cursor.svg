<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- Subtle beam cone -->
  <path d="M11 11L2 2L14 4L11 11Z" fill="#38bdf8" fill-opacity="0.38" />
  <circle cx="6" cy="6" r="4.5" fill="#38bdf8" fill-opacity="0.3" />
  <!-- Flashlight head & body tilted toward top-left hotspot (6,6) -->
  <g transform="rotate(-45 18 18)">
    <!-- Beam emitter lens -->
    <rect x="13" y="5" width="10" height="4" rx="1.5" fill="#eef0f8" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Flared bezel -->
    <path d="M13 9H23L21 14H15L13 9Z" fill="#1e2544" stroke="#8b6cff" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Torch grip body -->
    <rect x="15" y="14" width="6" height="13" rx="2" fill="#090b14" stroke="#eef0f8" stroke-width="1.5" />
    <!-- Power switch indicator -->
    <circle cx="18" cy="18.5" r="1.4" fill="#10b981" />
  </g>
</svg>
